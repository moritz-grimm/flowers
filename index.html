<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow">
    <title>Flowers</title>
    <link rel="stylesheet" href="./src/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Karla:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>

<body>
    <h1 class="birthdayWishes">Alles Gute, <br><em id="friendName">...</em></h1>
    <button id="confettiBtn">Confetti 🎉</button>

    <div class="bouquet">
        <div class="flower" style="--size:70px; --x:0px; --bottom:0px; --bg:var(--blush); --rot:-6deg; --delay:0.1s;"></div>
        <div class="flower" style="--size:50px; --x:-70px; --bottom:16px; --bg:var(--gold); --rot:14deg; --delay:0.35s;"></div>
        <div class="flower" style="--size:50px; --x:70px; --bottom:16px; --bg:var(--gold); --rot:-14deg; --delay:0.6s;"></div>
        <div class="flower" style="--size:34px; --x:-120px; --bottom:34px; --bg:var(--sage); --rot:20deg; --delay:0.85s;"></div>
        <div class="flower" style="--size:34px; --x:120px; --bottom:34px; --bg:var(--sage); --rot:-20deg; --delay:1.1s;"></div>
    </div>

    <script type="module" src="./src/main.ts"></script>
</body>

</html>
